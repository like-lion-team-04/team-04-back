# 운영 배포용 스택: nginx(같은 오리진) + backend + postgres(영속 볼륨)
# 사용: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firstbite}
      POSTGRES_USER: ${POSTGRES_USER:-firstbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 설정하세요}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firstbite} -d ${POSTGRES_DB:-firstbite}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # prod 기본. 소셜 로그인까지 켜려면 .env.prod 에서 SPRING_PROFILES_ACTIVE=prod,oauth
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-firstbite}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-firstbite}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      # 보안 시크릿 (반드시 강한 값으로 교체)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET(32바이트 이상)을 설정하세요}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?}
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY:?}
      # 쿠키: 같은 오리진 + HTTP(도메인/HTTPS 전) → Lax/비Secure. HTTPS 붙이면 None/Secure로 변경
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://1.201.116.77}
      # 휴대폰 인증: 실제 OCTOMO 키가 없으면 임시로 목 사용(APP_OCTOMO_MOCK=true)
      APP_OCTOMO_MOCK: ${APP_OCTOMO_MOCK:-false}
      OCTOMO_API_KEY: ${OCTOMO_API_KEY:-}
      OCTOMO_RECEIVER_NUMBER: ${OCTOMO_RECEIVER_NUMBER:-16663538}
      # 이미지 스토리지: 사내 MinIO(S3 호환). 자격증명은 MinIO 루트 계정과 동일하게 사용.
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-firstbite-images}
      # 선택 통합 (없으면 해당 기능만 비활성)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 소셜 로그인 (SPRING_PROFILES_ACTIVE=prod,oauth 일 때만 필요)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      OAUTH_SUCCESS_REDIRECT: ${OAUTH_SUCCESS_REDIRECT:-http://1.201.116.77/index.html}
      OAUTH_FAILURE_REDIRECT: ${OAUTH_FAILURE_REDIRECT:-http://1.201.116.77/login.html}
    expose:
      - "8080"

  # S3 호환 오브젝트 스토리지 (가비아 서버 내부, vdb 디스크에 데이터 저장)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER를 .env.prod에 설정하세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD를 .env.prod에 설정하세요}
      # SSE-S3(AES256) 지원을 위한 KMS 시크릿. 앱이 서버사이드 암호화로 업로드하므로 필요.
      # 형식: <키이름>:<base64 32바이트>. .env.prod에서 주입.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    volumes:
      # vdb를 마운트한 경로. 미마운트 시 루트 디스크의 named volume으로 폴백하려면 minio-data 사용.
      - ${MINIO_DATA_DIR:-minio-data}:/data
    expose:
      - "9000"
      - "9001"

  # 최초 1회 버킷 생성(멱등). 완료 후 종료.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do echo waiting for minio; sleep 2; done;
      mc mb --ignore-existing local/$S3_BUCKET_NAME;
      echo bucket-ready;
      "
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # HTTPS 붙일 때 아래 주석 해제 + 인증서 볼륨 마운트
      # - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트 정적 파일 경로(team04-front 클론 위치). 서버에서 실제 경로로 맞추세요.
      - ${FRONTEND_DIR:-../team04-front}:/usr/share/nginx/html:ro

volumes:
  postgres-data:
  minio-data:
