# 같은 오리진 구성: 한 도메인/IP에서 프론트(정적) + 백엔드(API) 함께 서빙
# 프론트 → /, 백엔드 → /api, /oauth2, /login/oauth2
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;  # 이미지 업로드(최대 10MB) 여유

    # 백엔드 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 소셜 로그인 (OAuth2 authorize / callback)
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Let's Encrypt HTTP-01 챌린지(도메인+HTTPS 붙일 때 사용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 프론트 정적 파일 (SPA 아님: 실제 .html 파일 라우팅)
    location / {
        try_files $uri $uri/ =404;
    }
}
