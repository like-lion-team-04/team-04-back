# 같은 오리진 구성: 한 도메인/IP에서 프론트(정적) + 백엔드(API) 함께 서빙
# 프론트 → /, 백엔드 → /api, /oauth2, /login/oauth2
# HTTPS: Let's Encrypt 인증서(1.201.116.77.sslip.io). 80은 ACME 챌린지 + HTTPS 리다이렉트.

# HTTP(80): ACME 챌린지만 그대로 처리하고 나머지는 HTTPS로 영구 리다이렉트
server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Let's Encrypt HTTP-01 챌린지(발급/갱신 시 webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443): 실제 서비스
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/1.201.116.77.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.201.116.77.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;  # 이미지 업로드(최대 10MB) 여유

    # 백엔드 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 소셜 로그인 (OAuth2 authorize / callback)
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트 정적 파일 (SPA 아님: 실제 .html 파일 라우팅)
    location / {
        try_files $uri $uri/ =404;
    }
}
