spring.application.name=firstbite-server

spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}

# OCTOMO MO verification
app.octomo.api-key=${OCTOMO_API_KEY:}
app.octomo.receiver-number=${OCTOMO_RECEIVER_NUMBER:16663538}

# Replace both values in every non-local environment.
app.security.phone-encryption-key=${PHONE_ENCRYPTION_KEY:firstbite-local-encryption-key-change-me}
app.security.phone-hmac-key=${PHONE_HMAC_KEY:firstbite-local-hmac-key-change-me}
app.security.jwt-secret=${JWT_SECRET:firstbite-local-jwt-secret-change-me-at-least-32-bytes}
app.security.access-token-seconds=${ACCESS_TOKEN_SECONDS:3600}
app.security.refresh-token-seconds=${REFRESH_TOKEN_SECONDS:1209600}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

spring.jpa.hibernate.ddl-auto=validate
