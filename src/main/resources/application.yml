spring:
  profiles:
    default: local

  application:
    name: firstbite-server

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # OCTOMO MO verification
  octomo:
    api-key: ${OCTOMO_API_KEY:}
    receiver-number: ${OCTOMO_RECEIVER_NUMBER:16663538}

  # Replace these values in every non-local environment.
  security:
    phone-encryption-key: ${PHONE_ENCRYPTION_KEY:firstbite-local-encryption-key-change-me}
    phone-hmac-key: ${PHONE_HMAC_KEY:firstbite-local-hmac-key-change-me}
    jwt-secret: ${JWT_SECRET:firstbite-local-jwt-secret-change-me-at-least-32-bytes}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:1209600}
    # 크로스 오리진(:3000 프론트 <-> :8080 백엔드)에서 Refresh 쿠키를 주고받으려면
    # SameSite=None; Secure 조합이 필요하다. localhost는 http여도 브라우저가 secure 컨텍스트로 취급한다.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:None}

  # 프론트 오리진 허용 (쉼표로 여러 개 지정 가능)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # S3 호환 이미지 스토리지 (AWS S3 또는 사내 MinIO)
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3-bucket: ${S3_BUCKET_NAME:}
    # 비어 있으면 실제 AWS S3, 값이 있으면 해당 엔드포인트(MinIO 등) 사용
    s3-endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  # OpenAI food recognition
  openai:
    api-key: ${OPENAI_API_KEY:}
    vision-model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
    endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1/responses}
    connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${OPENAI_REQUEST_TIMEOUT_SECONDS:40}
    max-attempts: ${OPENAI_MAX_ATTEMPTS:2}
