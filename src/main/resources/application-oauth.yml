# 소셜 로그인(카카오, 구글) 설정. 'oauth' 프로파일이 활성화될 때만 로드된다.
# 활성화 방법:
#   SPRING_PROFILES_ACTIVE=local,oauth 로 실행하고 아래 환경변수를 채운다.
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET
# 콜백(Redirect) URI 는 각 제공자 콘솔에 아래를 등록해야 한다.
#   http://localhost:8080/login/oauth2/code/google
#   http://localhost:8080/login/oauth2/code/kakao
spring:
  config:
    activate:
      on-profile: oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            # 간편가입: 이메일 없이 닉네임/프로필만 받는다. (이메일이 필요하면 account_email 추가 + 비즈앱 설정)
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  oauth2:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/index.html}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:3000/login.html}
